<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>APDI 교재</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #0B1220; color: #e2e8f0;
      font-family: sans-serif; overflow: hidden;
    }
    button, #bar, #chrome { touch-action: manipulation; }
    #chrome { display: none; padding: calc(10px + env(safe-area-inset-top)) 14px 8px; background: #0B132B; border-bottom: 1px solid #334155; }
    body.standalone #chrome { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    #bookTitle { font-size: 15px; font-weight: 700; color: #fff; }
    #bookMeta { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    #closeBtn, #downloadBtn {
      background: #00FFC2; color: #0F172A; padding: 8px 12px; flex-shrink: 0;
    }
    #bar {
      display: flex; align-items: center; gap: 6px; padding: 8px 8px;
      background: #1E293B; border-bottom: 1px solid #334155; flex-shrink: 0;
    }
    body.standalone #stage { height: calc(100% - 166px); }
    button {
      background: #00FFC2; color: #0F172A; border: 0; border-radius: 6px;
      padding: 6px 10px; font-weight: 700; cursor: pointer; font-size: 13px;
    }
    button:disabled { opacity: .4; cursor: default; }
    #status { font-size: 12px; color: #94a3b8; flex: 1; text-align: center; white-space: nowrap; }
    #stage {
      height: calc(100% - 46px);
      overflow: hidden;
      position: relative;
      background: #0B1220;
      overscroll-behavior: none;
    }
    #pan {
      width: 100%; height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    #sheet {
      transform-origin: center center;
      will-change: transform;
    }
    canvas { display: block; box-shadow: 0 8px 24px rgba(0,0,0,.35); background: #fff; }
    #hitLeft, #hitRight {
      position: absolute; top: 0; bottom: 0; width: 18%; z-index: 2;
    }
    #hitLeft { left: 0; }
    #hitRight { right: 0; }
    #hitLeft.disabled, #hitRight.disabled { pointer-events: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div id="chrome">
    <div>
      <div id="bookTitle">APDI 교재</div>
      <div id="bookMeta">좌우 넘김 · 두 손가락 확대/축소 · +/− 버튼 · 더블탭으로 원배율</div>
    </div>
    <button id="closeBtn" type="button">앱으로</button>
  </div>
  <div id="bar">
    <button id="backBtn" type="button">닫기</button>
    <button id="prev" type="button">이전</button>
    <button id="zoomOut" type="button" title="축소">−</button>
    <span id="status">불러오는 중…</span>
    <button id="zoomIn" type="button" title="확대">+</button>
    <button id="downloadBtn" type="button">저장</button>
    <button id="next" type="button">다음</button>
  </div>
  <div id="stage">
    <div id="hitLeft"></div>
    <div id="pan"><div id="sheet"><canvas id="pdfCanvas"></canvas></div></div>
    <div id="hitRight"></div>
  </div>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const params = new URLSearchParams(location.search);
    const file = params.get('file') || '';
    const bookTitle = params.get('title') || 'APDI 교재';
    const bookKey = params.get('bookKey') || bookTitle;
    const inIframe = (() => { try { return window !== window.top; } catch (_) { return true; } })();
    const standalone = !inIframe;
    function leaveReader() {
      try {
        if (window.opener && !window.opener.closed) {
          window.close();
          return;
        }
      } catch (_) {}
      const appUrl = new URL('.', location.href).href;
      if (history.length > 1) {
        history.back();
        setTimeout(() => {
          if (location.pathname.indexOf('pdf_viewer') >= 0) location.replace(appUrl);
        }, 400);
        return;
      }
      location.replace(appUrl);
    }
    function downloadPdf() {
      if (!file) return;
      const a = document.createElement('a');
      a.href = file;
      a.download = (bookTitle || 'APDI-manual').replace(/[\\/:*?"<>|]/g, '_') + '.pdf';
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    if (standalone) {
      document.body.classList.add('standalone');
      document.title = bookTitle;
      document.getElementById('bookTitle').textContent = bookTitle;
    } else {
      document.getElementById('backBtn').style.display = 'none';
    }
    document.getElementById('closeBtn').onclick = leaveReader;
    document.getElementById('backBtn').onclick = leaveReader;
    document.getElementById('downloadBtn').onclick = downloadPdf;
    const canvas = document.getElementById('pdfCanvas');
    const status = document.getElementById('status');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    const zoomInBtn = document.getElementById('zoomIn');
    const zoomOutBtn = document.getElementById('zoomOut');
    const pan = document.getElementById('pan');
    const sheet = document.getElementById('sheet');
    const hitLeft = document.getElementById('hitLeft');
    const hitRight = document.getElementById('hitRight');
    let pdf = null;
    let pageNum = 1;
    let rendering = false;
    let pendingPage = null;
    let lastFitKey = '';
    // Live CSS zoom during pinch; settledZoom is baked into canvas resolution.
    let liveScale = 1;
    let settledZoom = 1;
    let panX = 0;
    let panY = 0;
    let cssW = 0;
    let cssH = 0;
    let pointers = new Map();
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let pinchMidStart = null;
    let panStart = null;
    let dragStart = null;
    let swiping = false;
    let renderTask = null;
    let lastGoAt = 0;
    let hiResTimer = 0;
    let lastTapAt = 0;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 4;

    function dpr() {
      return Math.min(window.devicePixelRatio || 1, 3);
    }

    function totalZoom() {
      return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, settledZoom * liveScale));
    }

    function clampPan() {
      // cssW/cssH already include settledZoom; only liveScale is CSS-transformed.
      const z = Math.max(0.01, liveScale);
      if (settledZoom <= 1.001 && liveScale <= 1.001 || !cssW || !cssH) {
        panX = 0;
        panY = 0;
        return;
      }
      const stage = document.getElementById('stage');
      const maxX = Math.max(0, (cssW * z - stage.clientWidth) / 2 + 24);
      const maxY = Math.max(0, (cssH * z - stage.clientHeight) / 2 + 24);
      panX = Math.min(maxX, Math.max(-maxX, panX));
      panY = Math.min(maxY, Math.max(-maxY, panY));
    }

    function applyTransform() {
      if (totalZoom() <= 1.02) {
        liveScale = 1;
        settledZoom = 1;
        panX = 0;
        panY = 0;
      } else {
        clampPan();
      }
      // Settled zoom is baked into canvas CSS size; liveScale is pinch-only.
      sheet.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + liveScale + ')';
      const zoomed = totalZoom() > 1.05;
      hitLeft.classList.toggle('disabled', zoomed);
      hitRight.classList.toggle('disabled', zoomed);
      zoomOutBtn.disabled = totalZoom() <= 1.01;
      zoomInBtn.disabled = totalZoom() >= MAX_ZOOM - 0.01;
    }

    function notifyPage() {
      if (!pdf) return;
      const payload = { type: 'apdi-pdf-page', page: pageNum, pages: pdf.numPages, bookKey: bookKey };
      try { parent.postMessage(payload, '*'); } catch (_) {}
      try { if (window.opener && !window.opener.closed) window.opener.postMessage(payload, '*'); } catch (_) {}
    }

    function fitKey() {
      const wrap = document.getElementById('stage');
      return [
        Math.round(wrap.clientWidth / 8),
        Math.round(wrap.clientHeight / 8),
        Math.round(settledZoom * 10),
        Math.round(dpr() * 10),
        document.getElementById('stage').clientWidth > document.getElementById('stage').clientHeight ? 'L' : 'P'
      ].join('x');
    }

    function commitZoom(nextZoom) {
      nextZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, nextZoom));
      if (nextZoom <= 1.05) {
        settledZoom = 1;
        liveScale = 1;
        panX = 0;
        panY = 0;
      } else {
        // Keep settledZoom (canvas CSS) until render finishes; liveScale holds the gap.
        liveScale = nextZoom / Math.max(MIN_ZOOM, settledZoom);
      }
      if (Math.abs(panX) < 8 && Math.abs(panY) < 8) { panX = 0; panY = 0; }
      applyTransform();
      scheduleHiRes();
    }

    function scheduleHiRes() {
      clearTimeout(hiResTimer);
      hiResTimer = setTimeout(() => {
        lastFitKey = '';
        render(true);
      }, 160);
    }

    async function render(force) {
      if (!pdf) return;
      if (rendering) {
        pendingPage = pageNum;
        return;
      }
      const key = fitKey();
      if (!force && key === lastFitKey && canvas.width > 0) {
        status.textContent = pageNum + ' / ' + pdf.numPages + (totalZoom() > 1.05 ? (' · ' + Math.round(totalZoom() * 100) + '%') : '');
        prev.disabled = pageNum <= 1;
        next.disabled = pageNum >= pdf.numPages;
        notifyPage();
        return;
      }
      rendering = true;
      if (renderTask) {
        try { renderTask.cancel(); } catch (_) {}
        renderTask = null;
      }
      try {
        const page = await pdf.getPage(pageNum);
        const wrap = document.getElementById('stage');
        const base = page.getViewport({ scale: 1 });
        const availW = Math.max(120, wrap.clientWidth - 16);
        const availH = Math.max(120, wrap.clientHeight - 16);
        const landscape = wrap.clientWidth > wrap.clientHeight;
        const fit = Math.min(availW / base.width, availH / base.height);
        // Visual zoom (settled * live); bake into CSS+bitmap so landscape stays sharp.
        const zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, settledZoom * liveScale));
        cssW = base.width * fit * zoom;
        cssH = base.height * fit * zoom;
        // Extra pixel density in landscape (short viewport) to keep text crisp.
        const pixelRatio = Math.min(dpr() * (landscape ? 1.35 : 1), 3.5);
        let pixelScale = fit * zoom * pixelRatio;
        let viewport = page.getViewport({ scale: pixelScale });
        // iOS canvas soft-limit ~16MP / long-edge; keep under to avoid silent fail.
        const maxPx = landscape ? 6144 : 5120;
        const maxArea = 16 * 1024 * 1024;
        let biggest = Math.max(viewport.width, viewport.height);
        let area = viewport.width * viewport.height;
        if (biggest > maxPx || area > maxArea) {
          const byEdge = biggest > maxPx ? maxPx / biggest : 1;
          const byArea = area > maxArea ? Math.sqrt(maxArea / area) : 1;
          pixelScale *= Math.min(byEdge, byArea);
          viewport = page.getViewport({ scale: pixelScale });
        }
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        // CSS size now includes zoom — drop liveScale in the same frame to avoid double-scale.
        settledZoom = zoom <= 1.05 ? 1 : zoom;
        liveScale = 1;
        applyTransform();
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.imageSmoothingEnabled = false;
        renderTask = page.render({ canvasContext: ctx, viewport: viewport });
        await renderTask.promise;
        renderTask = null;
        lastFitKey = fitKey();
        status.textContent = pageNum + ' / ' + pdf.numPages + (zoom > 1.05 ? (' · ' + Math.round(zoom * 100) + '%') : '');
        prev.disabled = pageNum <= 1;
        next.disabled = pageNum >= pdf.numPages;
        notifyPage();
      } catch (e) {
        if (e && e.name === 'RenderingCancelledException') return;
      } finally {
        rendering = false;
        if (pendingPage != null && pendingPage !== pageNum) {
          const nextPending = pendingPage;
          pendingPage = null;
          pageNum = nextPending;
          render(true);
        } else {
          pendingPage = null;
        }
      }
    }

    function go(delta) {
      if (!pdf) return;
      const now = Date.now();
      if (now - lastGoAt < 220) return;
      lastGoAt = now;
      const nextNum = pageNum + delta;
      if (nextNum < 1 || nextNum > pdf.numPages) return;
      pageNum = nextNum;
      liveScale = 1;
      settledZoom = 1;
      panX = 0;
      panY = 0;
      lastFitKey = '';
      render(true);
    }

    function bumpZoom(factor) {
      if (totalZoom() <= 1.05) { panX = 0; panY = 0; }
      commitZoom(totalZoom() * factor);
    }

    prev.onclick = () => go(-1);
    next.onclick = () => go(1);
    zoomInBtn.onclick = () => bumpZoom(1.35);
    zoomOutBtn.onclick = () => bumpZoom(1 / 1.35);
    hitLeft.onclick = (e) => { e.stopPropagation(); if (totalZoom() <= 1.05) go(-1); };
    hitRight.onclick = (e) => { e.stopPropagation(); if (totalZoom() <= 1.05) go(1); };

    function pointerDistance() {
      const pts = [...pointers.values()];
      if (pts.length < 2) return 0;
      const dx = pts[0].x - pts[1].x;
      const dy = pts[0].y - pts[1].y;
      return Math.hypot(dx, dy);
    }

    function pointerMid() {
      const pts = [...pointers.values()];
      if (pts.length < 2) return null;
      return { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
    }

    pan.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      pan.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        pinchStartDist = Math.max(1, pointerDistance());
        // liveScale is relative to settledZoom: total = settled * live
        pinchStartScale = totalZoom() / Math.max(MIN_ZOOM, settledZoom);
        pinchMidStart = pointerMid();
        panStart = { x: panX, y: panY };
        swiping = false;
        dragStart = null;
      } else if (pointers.size === 1) {
        const now = Date.now();
        if (now - lastTapAt < 280 && totalZoom() > 1.05) {
          // Double-tap reset
          commitZoom(1);
          lastTapAt = 0;
        } else {
          lastTapAt = now;
        }
        dragStart = { x: e.clientX, y: e.clientY, panX: panX, panY: panY, t: now };
        swiping = totalZoom() <= 1.05;
      }
    }, { passive: false });

    pan.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size >= 2 && pinchStartDist > 0) {
        const ratio = pointerDistance() / pinchStartDist;
        liveScale = pinchStartScale * ratio;
        // Keep total zoom in range via applyTransform clamp path
        const raw = settledZoom * liveScale;
        if (raw < MIN_ZOOM) liveScale = MIN_ZOOM / settledZoom;
        if (raw > MAX_ZOOM) liveScale = MAX_ZOOM / settledZoom;
        const mid = pointerMid();
        if (mid && pinchMidStart && panStart) {
          panX = panStart.x + (mid.x - pinchMidStart.x);
          panY = panStart.y + (mid.y - pinchMidStart.y);
        }
        applyTransform();
        return;
      }
      if (dragStart && pointers.size === 1 && totalZoom() > 1.05) {
        panX = dragStart.panX + (e.clientX - dragStart.x);
        panY = dragStart.panY + (e.clientY - dragStart.y);
        applyTransform();
      }
    }, { passive: true });

    function endPointer(e, cancelled) {
      const start = dragStart;
      pointers.delete(e.pointerId);
      try { pan.releasePointerCapture(e.pointerId); } catch (_) {}
      if (pointers.size < 2) {
        if (pinchStartDist > 0) {
          pinchStartDist = 0;
          pinchMidStart = null;
          panStart = null;
          commitZoom(totalZoom());
        }
      }
      if (!cancelled && pointers.size === 0 && start && swiping && totalZoom() <= 1.05) {
        const dx = e.clientX - start.x;
        const dy = e.clientY - start.y;
        if (Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.2) {
          go(dx < 0 ? 1 : -1);
        }
      }
      if (pointers.size === 0) {
        dragStart = null;
        swiping = false;
      } else if (pointers.size === 1) {
        // One finger left after pinch — start a fresh pan from current offset
        const rem = [...pointers.values()][0];
        dragStart = { x: rem.x, y: rem.y, panX: panX, panY: panY, t: Date.now() };
        swiping = false;
      }
    }

    pan.addEventListener('pointerup', (e) => endPointer(e, false));
    pan.addEventListener('pointercancel', (e) => endPointer(e, true));
    pan.addEventListener('lostpointercapture', (e) => {
      if (pointers.has(e.pointerId)) endPointer(e, true);
    });

    // Mouse wheel zoom (desktop / trackpad)
    pan.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      commitZoom(totalZoom() * factor);
    }, { passive: false });

    let resizeTimer = 0;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const key = fitKey();
        if (key !== lastFitKey) render(true);
      }, 280);
    });
    window.addEventListener('orientationchange', () => {
      liveScale = 1;
      settledZoom = 1;
      panX = 0;
      panY = 0;
      lastFitKey = '';
      setTimeout(() => {
        requestAnimationFrame(() => requestAnimationFrame(() => render(true)));
      }, 450);
    });

    (async function () {
      if (!file) { status.textContent = 'PDF 주소가 없습니다.'; return; }
      function driveId(u) {
        const m = u.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || u.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
        return m ? m[1] : '';
      }
      function isDrive(u) {
        return /drive\.google\.com|docs\.google\.com/i.test(u);
      }
      function showFrame(src) {
        const stage = document.getElementById('stage');
        stage.innerHTML = '<iframe id="fallbackFrame" src="' + src.replace(/"/g, '') + '" style="width:100%;height:100%;border:0;background:#fff" allow="fullscreen"></iframe>';
        prev.disabled = true;
        next.disabled = true;
        zoomInBtn.disabled = true;
        zoomOutBtn.disabled = true;
        status.textContent = '교재 보기';
      }
      if (isDrive(file)) {
        const id = driveId(file);
        showFrame(id ? ('https://drive.google.com/file/d/' + id + '/preview') : file);
        return;
      }
      try {
        pdf = await pdfjsLib.getDocument({
          url: file,
          withCredentials: false,
          disableRange: true,
          disableStream: true,
          disableAutoFetch: true,
        }).promise;
        pageNum = 1;
        await render(true);
      } catch (e) {
        try {
          showFrame(file);
        } catch (_) {
          status.textContent = 'PDF를 열 수 없습니다. CORS 또는 주소를 확인하세요.';
        }
      }
    })();
  </script>
</body>
</html>
