<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APDI SMART HUB · Talk 상담</title>
  <style>
    :root { --ink:#0B132B; --accent:#FEE500; --muted:#64748B; }
    body { font-family: Pretendard, "Apple SD Gothic Neo", sans-serif; margin:0; color:var(--ink); background:#F8FAFC; line-height:1.55; }
    .wrap { max-width:520px; margin:0 auto; padding:28px 20px 48px; }
    h1 { font-size:1.4rem; margin:0 0 8px; }
    .sub { color:var(--muted); margin-bottom:20px; }
    .card { background:#fff; border:1px solid #E2E8F0; border-radius:14px; padding:18px 18px; margin:14px 0; }
    .tip { background:#0B132B; color:#E2E8F0; border-radius:12px; padding:14px 16px; }
    .tip strong { color:#00FFC2; }
    .actions { display:flex; flex-direction:column; gap:10px; margin-top:18px; }
    .actions a, .actions button {
      appearance:none; display:block; text-align:center; text-decoration:none;
      border-radius:12px; padding:14px 16px; font:inherit; font-weight:700; cursor:pointer; border:none;
    }
    .talk { background:var(--accent); color:#191919; }
    .app { background:#0B132B; color:#fff; }
    .ghost { background:#fff; border:1px solid #CBD5E1; color:var(--ink); }
    .note { font-size:0.9rem; color:var(--muted); margin-top:8px; }
    @media print { .actions { display:none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>APDI Talk · 문의 · 상담</h1>
    <p class="sub">교육 입문, 담당 강사, 발급·크레딧 등 궁금한 점을 상담할 수 있습니다.</p>

    <div class="tip">
      <strong>교육생 안내</strong><br>
      담당 강사를 모르시거나 처음 교육을 받고자 입문하시는 분은 담당 강사 번호를 <strong>101</strong>로 지정해 주세요.
    </div>

    <div class="card">
      <p style="margin:0 0 8px;"><strong>상담이 필요한 경우</strong></p>
      <ul style="margin:0; padding-left:1.2rem;">
        <li>담당 강사·과정 선택 상담</li>
        <li>로그인·등록 문의</li>
        <li>발급·크레딧·본부 운영 문의</li>
      </ul>
      <p class="note">카카오톡·네이버톡 채널 URL이 준비되면 아래 Talk 버튼이 해당 채팅으로 바로 연결됩니다.</p>
    </div>

    <div class="actions">
      <!-- 카카오/네이버 URL이 생기면 href만 교체: 예) https://pf.kakao.com/_xxxx/chat -->
      <a class="talk" id="talkLink" href="#talk">Talk 문의하기</a>
      <a class="app" href="https://jckim321.github.io/apdi/">앱으로 돌아가기</a>
      <button type="button" class="ghost" onclick="if (window.history.length > 1) history.back(); else window.close();">닫기</button>
    </div>
  </div>
  <script>
    // 채널 URL을 여기에 넣으면 Talk 버튼이 바로 이동합니다. 예: 'https://pf.kakao.com/_xxxx/chat'
    var APDI_TALK_CHANNEL_URL = 'https://pf.kakao.com/_slxjSX/chat';
    (function () {
      var a = document.getElementById('talkLink');
      if (APDI_TALK_CHANNEL_URL) {
        a.href = APDI_TALK_CHANNEL_URL;
        a.target = '_blank';
        a.rel = 'noopener';
      } else {
        a.addEventListener('click', function (e) {
          e.preventDefault();
          alert('상담 채널 연결을 준비 중입니다.\n교육생은 담당 강사 번호 101로 등록한 뒤 앱에서 과정을 신청해 주세요.\n급하면 소속 지역본부 또는 총괄본부에 문의해 주세요.');
        });
      }
    })();
  </script>
</body>
</html>
