<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="APDI 공식 스쿠버 & 프리다이빙 디지털 아카데미">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS 아이폰 사파리 전용 PWA 설정 태그 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APDI">

  <link rel="icon" type="image/png" href="favicon.png?v=20260917p"/>
  <link rel="manifest" href="manifest.json">

  <title>APDI SMART HUB</title>
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #0A192F;
    }
    flt-glass-pane, flutter-view, flt-scene-host {
      height: 100% !important;
      width: 100% !important;
    }
  </style>
</head>
<body>
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
      } catch (e) {}
      const s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?v=20260917p';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
